<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thread asset viewer</title>
<style>
  :root { color-scheme: light dark; font: 13px system-ui, sans-serif; }
  body { margin: 0; background: #e9e4dc; overflow: hidden; }
  #ui { position: fixed; top: 8px; left: 8px; background: #fffc; padding: 8px 10px; border-radius: 8px; max-width: 300px; color: #222; }
  #ui label { display: block; margin: 3px 0; }
  #stats { white-space: pre; font: 11px ui-monospace, monospace; margin-top: 6px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="ui">
  <b>Thread asset viewer</b> (dev tool)
  <label><input type="checkbox" id="pose"> test pose (skinning)</label>
  <label><input type="checkbox" id="bones"> show skeleton</label>
  <label>expression <select id="morph"><option value="">neutral</option></select></label>
  <div id="stats"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ?files=body.glb,garment.glb (paths relative to /output/)
const files = (new URLSearchParams(location.search).get('files') || 'body-demo/body.glb').split(',');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9e4dc');
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 1.1, 4.2);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 0.95, 0); controls.update();
const sun = new THREE.DirectionalLight('#fff', 1.6); sun.position.set(2, 4, 3); sun.castShadow = true; scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.ShadowMaterial({ opacity: 0.25 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const skinned = [], helpers = [], stats = [];
const loader = new GLTFLoader();
for (const file of files) {
  const gltf = await loader.loadAsync('/output/' + file);
  gltf.scene.traverse(o => {
    if (o.isMesh) { o.castShadow = true; stats.push(`${file}: ${o.geometry.index.count / 3} tris`); }
    if (o.isSkinnedMesh) skinned.push(o);
  });
  scene.add(gltf.scene);
  const helper = new THREE.SkeletonHelper(gltf.scene); helper.visible = false; scene.add(helper); helpers.push(helper);
}
// Hide body triangles under opaque garments (extras.thread.coversBodyTriangles bitsets, OR-ed).
const body = skinned.find(m => !m.userData.thread);
const covers = skinned.map(m => m.userData.thread?.coversBodyTriangles).filter(Boolean);
if (body && covers.length) {
  const index = body.geometry.index.array, triangles = index.length / 3, kept = [];
  const masks = covers.map(b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
  for (let t = 0; t < triangles; t++) {
    if (masks.some(m => m[t >> 3] & (0x80 >> (t & 7)))) continue;
    kept.push(index[3 * t], index[3 * t + 1], index[3 * t + 2]);
  }
  body.geometry.setIndex(kept);
  stats.push(`body: hid ${triangles - kept.length / 3} covered triangles`);
}
const face = skinned.find(m => m.morphTargetDictionary);
if (face) for (const name of Object.keys(face.morphTargetDictionary)) document.querySelector('#morph').add(new Option(name, name));
document.querySelector('#stats').textContent = stats.join('\n');

const rest = new Map();
function setPose(on) {
  for (const mesh of skinned) for (const bone of mesh.skeleton.bones) {
    if (!rest.has(bone)) rest.set(bone, bone.quaternion.clone());
    bone.quaternion.copy(rest.get(bone));
    if (!on) continue;
    const turn = (axis, deg) => bone.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(axis, THREE.MathUtils.degToRad(deg)));
    if (bone.name === 'upperarm01_L') turn(new THREE.Vector3(0, 0, 1), 50);
    if (bone.name === 'upperarm01_R') turn(new THREE.Vector3(1, 0, 0), 45);
    if (bone.name === 'lowerarm01_R') turn(new THREE.Vector3(1, 0, 0), 70);
    if (bone.name === 'upperleg01_R') turn(new THREE.Vector3(1, 0, 0), -35);
    if (bone.name === 'lowerleg01_R') turn(new THREE.Vector3(1, 0, 0), 60);
    if (bone.name === 'neck01') turn(new THREE.Vector3(0, 0, 1), 12);
  }
}
document.querySelector('#pose').onchange = e => setPose(e.target.checked);
document.querySelector('#bones').onchange = e => helpers.forEach(h => (h.visible = e.target.checked));
document.querySelector('#morph').onchange = e => {
  for (const mesh of skinned) if (mesh.morphTargetInfluences) {
    mesh.morphTargetInfluences.fill(0);
    const i = mesh.morphTargetDictionary[e.target.value]; if (i !== undefined) mesh.morphTargetInfluences[i] = 1;
  }
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
renderer.setAnimationLoop(() => renderer.render(scene, camera));
window.threadViewer = { scene, camera, controls, setPose };
</script>
</body>
</html>
